packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  # esbuild + sharp + unrs-resolver ship prebuilt binaries we want.
  esbuild: true
  sharp: true
  unrs-resolver: true
  # The next three are optional native perf addons with pure-JS fallbacks already
  # bundled in the package. Disabling them avoids needing MSVC Build Tools on Windows.
  bufferutil: false
  keccak: false
  utf-8-validate: false
# pnpm 11 blocks transitive deps resolved via URL/git by default. viem ships one
# (`ox`), so disable the block. Upstream-recommended workaround.
blockExoticSubdeps: false
